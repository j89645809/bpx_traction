[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpx-force-estimator"
version = "0.1.0"
description = "Temporal force and missing-state estimation for BPX force-aware RMA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
deploy = ["onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]
