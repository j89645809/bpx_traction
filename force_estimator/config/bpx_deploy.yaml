# Direct BPX inference contract for the 45-D BPX force model.
model: /path/to/accepted/bpx_force.onnx
normalization: /path/to/accepted/normalization.npz
input:
  shape: [batch, 25, 45]
  sample_period_s: 0.02
  quaternion_order: wxyz
  history_order: oldest_to_newest
output:
  values_shape: [batch, 3]
  confidence_shape: [batch, 1]
  force_frame: body
policy_handoff:
  body_force_scale_n: 45.0
  body_force_clip: [-1.0, 1.0]
  output_shape: [batch, 3]
  confidence_shape: [batch, 1]
